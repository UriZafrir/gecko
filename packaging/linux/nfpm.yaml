# .deb and .rpm packages, built by packaging/build.sh with nfpm.
name: gecko
arch: ${ARCH}
platform: linux
version: ${PKG_VERSION}
section: utils
priority: optional
maintainer: Gecko contributors
description: |
  The terminal for running coding agents across all your machines.
  Sessions that survive anything, agents you can see at a glance,
  from your desktop or your phone.
homepage: https://github.com/eternaleclipse/gecko
suggests:
  - tmux
  - mosh
contents:
  - src: dist/build/linux/gecko
    dst: /usr/bin/gecko
    file_info:
      mode: 0755
  - src: dist/build/linux/gecko.desktop
    dst: /usr/share/applications/gecko.desktop
    file_info:
      mode: 0644
  - src: packaging/linux/gecko.svg
    dst: /usr/share/icons/hicolor/scalable/apps/gecko.svg
    file_info:
      mode: 0644
  - src: packaging/linux/gecko-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/gecko.png
    file_info:
      mode: 0644
