# Linux packages (docs/linux-packages.md): .deb, .rpm, Arch, snap and the
# apt repository, each built and smoke-tested on its own distro (container or
# runner). Nothing is published from here unless run by hand with
# publish-apt; the store uploads are manual (docs/linux-packages.md).
name: Linux packages

on:
  push:
    branches: [feature/desktop-apps]
  workflow_dispatch:
    inputs:
      publish-apt:
        description: Publish the signed apt repository to GitHub Pages (needs the APT_SIGNING_KEY secret)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - id: v
        run: |
          t=$(git describe --tags --abbrev=0); echo "version=${t#v}" >>"$GITHUB_OUTPUT"
      - name: Packages (gecko, gecko-desktop; amd64, arm64) and tarballs
        run: make packages PLATFORMS=linux
      - name: Offline source tarball (PPA, COPR)
        run: PKG_VERSION=${{ steps.v.outputs.version }} packaging/linux/source-tarball.sh
      - run: ls -l dist/packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: dist/packages
          retention-days: 14

  deb:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:22.04", "debian:12", "debian:13"]
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: pkgs
      - name: Install from the apt repository (signed with a throwaway key)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq && apt-get install -y -qq apt-utils gnupg python3 curl lintian xvfb x11-apps imagemagick >/dev/null
          mkdir -p debs && cp pkgs/*.deb debs/
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --passphrase '' --quick-gen-key "Gecko CI throwaway <ci@invalid>" ed25519 sign never
          key=$(gpg --list-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          APT_REPO_URL=http://127.0.0.1:8765 packaging/linux/apt-repo.sh debs repo "$key"
          (cd repo && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 1
          install -d /etc/apt/keyrings
          curl -fsS http://127.0.0.1:8765/gecko-archive-keyring.gpg >/etc/apt/keyrings/gecko.gpg
          echo "deb [signed-by=/etc/apt/keyrings/gecko.gpg] http://127.0.0.1:8765 stable main" >/etc/apt/sources.list.d/gecko.list
          apt-get update -qq
          apt-get install -y gecko
          dpkg -l gecko gecko-desktop | tail -2
      - name: Lintian
        run: |
          for d in pkgs/gecko_*_amd64.deb pkgs/gecko-desktop_*_amd64.deb; do
            echo "== $d"; lintian --no-tag-display-limit --info "$d" || true
          done 2>&1 | tee lintian.txt
      - name: Smoke test
        run: |
          useradd -m tester
          mkdir -p out
          chown tester out
          su tester -c 'packaging/linux/smoke.sh out'
      - if: always()
        run: echo "IMG=$(echo '${{ matrix.image }}' | tr ':.' '--')" >>"$GITHUB_ENV"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ env.IMG }}
          path: |
            out
            lintian.txt

  ppa-source:
    needs: build
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: pkgs
      - name: Source and binary package, offline
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq && apt-get install -y -qq devscripts debhelper golang-go lintian fakeroot >/dev/null
          v=${{ needs.build.outputs.version }}
          mkdir build && cd build
          cp ../pkgs/gecko-$v-src.tar.gz gecko_$v.orig.tar.gz
          tar -xzf gecko_$v.orig.tar.gz
          cp -a ../packaging/debian gecko-$v/debian
          cd gecko-$v
          dpkg-buildpackage -S -us -uc -d
          # Launchpad builders have no network: no module proxy, no npm.
          GOPROXY=off GOFLAGS=-mod=vendor dpkg-buildpackage -b -us -uc
          cd ..
          ls -l
          lintian --no-tag-display-limit --info *.changes *.dsc | tee lintian.txt || true
          apt-get install -y ./gecko_${v}-1_amd64.deb
          gecko version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ppa-source
          path: |
            build/*.dsc
            build/*.debian.tar.*
            build/*.changes
            build/*.buildinfo
            build/*.deb
            build/lintian.txt

  rpm:
    needs: build
    runs-on: ubuntu-24.04
    container: fedora:43
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: pkgs
      - name: rpmbuild from the spec (offline sources)
        run: |
          dnf -y -q install rpm-build rpmlint golang systemd-rpm-macros desktop-file-utils libappstream-glib >/dev/null
          v=${{ needs.build.outputs.version }}
          mkdir -p ~/rpmbuild/SOURCES
          cp pkgs/gecko-$v-src.tar.gz pkgs/gecko-$v-linux-x86_64.tar.gz ~/rpmbuild/SOURCES/
          GOPROXY=off rpmbuild -ba --define "gecko_version $v" packaging/rpm/gecko.spec
          mkdir -p out && cp ~/rpmbuild/RPMS/x86_64/*.rpm ~/rpmbuild/SRPMS/*.rpm out/
          rpmlint packaging/rpm/gecko.spec out/*.rpm | tee out/rpmlint.txt || true
      - name: Install and smoke test
        run: |
          dnf -y -q install ./out/gecko-[0-9]*.x86_64.rpm ./out/gecko-desktop-*.x86_64.rpm xorg-x11-server-Xvfb ImageMagick python3 curl procps-ng util-linux shadow-utils >/dev/null
          rpm -q gecko gecko-desktop
          useradd -m tester
          chown tester out
          su tester -c 'packaging/linux/smoke.sh out'
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-fedora
          path: out

  arch:
    needs: build
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: pkgs
      - name: makepkg gecko-bin, namcap
        run: |
          pacman -Syu --noconfirm --needed namcap git xorg-server-xvfb imagemagick python curl procps-ng >/dev/null
          v=${{ needs.build.outputs.version }}
          useradd -m builder
          mkdir -p work/gecko-bin out
          cp packaging/arch/gecko-bin/PKGBUILD work/gecko-bin/
          cp pkgs/gecko-$v-linux-x86_64.tar.gz work/gecko-bin/
          chown -R builder work out
          cd work/gecko-bin
          # The release isn't on GitHub yet: build from the CI tarball.
          sed -i "s|^source_x86_64=.*|source_x86_64=(\"gecko-$v-linux-x86_64.tar.gz\")|" PKGBUILD
          su builder -c 'makepkg --noconfirm'
          diff <(su builder -c 'makepkg --printsrcinfo' | grep -v source_x86_64) <(grep -v source_x86_64 ../../packaging/arch/gecko-bin/.SRCINFO) && echo ".SRCINFO up to date"
          namcap ../../packaging/arch/gecko-bin/PKGBUILD | tee ../../out/namcap.txt
          namcap gecko-bin-*.pkg.tar.zst | tee -a ../../out/namcap.txt
          cp gecko-bin-*.pkg.tar.zst ../../out/
          pacman -U --noconfirm gecko-bin-*.pkg.tar.zst
      - name: Smoke test
        run: |
          useradd -m tester
          chown tester out
          su tester -c 'packaging/linux/smoke.sh out'
      - name: makepkg gecko (source build, system electron)
        continue-on-error: true
        run: |
          pacman -S --noconfirm --needed go npm electron >/dev/null
          pacman -R --noconfirm gecko-bin
          mkdir -p work/gecko
          git config --global --add safe.directory "$PWD"
          v=${{ needs.build.outputs.version }}
          git archive --prefix=gecko-$v/ -o work/gecko/gecko-$v.tar.gz HEAD
          cp packaging/arch/gecko/PKGBUILD work/gecko/
          chown -R builder work
          cd work/gecko
          sed -i "s|^source=.*|source=(\"gecko-$v.tar.gz\")|" PKGBUILD
          su builder -c 'makepkg --noconfirm'
          namcap gecko-$v-*.pkg.tar.zst | tee ../../out/namcap-source.txt
          cp gecko-$v-*.pkg.tar.zst ../../out/
          pacman -U --noconfirm gecko-$v-*.pkg.tar.zst
          gecko version
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch
          path: out

  snap:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: dist/packages
      - name: snapcraft pack (destructive mode on 24.04, the core24 base)
        run: |
          sudo snap install snapcraft --classic
          mkdir -p out
          sudo packaging/snap/build.sh ${{ needs.build.outputs.version }} 2>&1 | tee out/snapcraft.txt
          sudo snapcraft lint dist/packages/gecko_*.snap 2>&1 | tee out/snapcraft-lint.txt || true
          cp dist/packages/gecko_*.snap out/
      - name: Install and smoke test
        run: |
          sudo snap install --dangerous --classic out/gecko_*.snap
          sudo apt-get install -y -qq xvfb imagemagick >/dev/null
          snap list gecko
          GECKO_SMOKE_DESKTOP=gecko.desktop packaging/linux/smoke.sh out
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snap
          path: out

  apt-pages:
    if: github.event_name == 'workflow_dispatch' && inputs.publish-apt
    needs: [build, deb]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: pkgs
      - name: Signed repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          test -n "$APT_SIGNING_KEY" || { echo "set the APT_SIGNING_KEY secret (docs/linux-packages.md)"; exit 1; }
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          mkdir debs && cp pkgs/*.deb debs/
          packaging/linux/apt-repo.sh debs site "$key"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
